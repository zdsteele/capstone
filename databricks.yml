bundle:
  name: edgar-intelligence-platform

variables:
  catalog:
    default: bootcamp_students
  schema:
    default: zdsteele
  warehouse_id:
    default: b15d3d6f837ba428

resources:
  jobs:
    analytics_cdf_on_change:
      name: "EDGAR - analytics CDF (triggered by lb_*_history)"
      description: >
        Runs 06_analytics_cdf.py when any reverse-CDC history table changes.
        Debounced 60s so a burst of agent writes batches into one run.
      trigger:
        table_update:
          condition: ANY_UPDATED
          table_names:
            - "${var.catalog}.${var.schema}.lb_edgar_zdsteele_agent_actions_history"
            - "${var.catalog}.${var.schema}.lb_edgar_zdsteele_saved_filings_history"
            - "${var.catalog}.${var.schema}.lb_edgar_zdsteele_saved_research_history"
            - "${var.catalog}.${var.schema}.lb_edgar_zdsteele_watchlist_companies_history"
            - "${var.catalog}.${var.schema}.lb_edgar_zdsteele_watchlists_history"
            - "${var.catalog}.${var.schema}.lb_edgar_zdsteele_agent_conversations_history"
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: analytics_cdf
          notebook_task:
            notebook_path: ./notebooks/06_analytics_cdf.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"

  apps:
    edgar_intelligence:
      name: "edgar-intelligence"
      description: "EDGAR Intelligence Platform frontend + in-process research agent"
      source_code_path: .
      resources:
        # Lakebase — injects PGHOST/PGUSER/PGDATABASE/PGPORT + a rotated credential
        - name: database
          database:
            database_name: databricks_postgres
            instance_name: summer-bootcamp-2026-v2
            permission: CAN_CONNECT_AND_CREATE
        # SQL warehouse for Gold/Silver Delta reads
        - name: sql_warehouse
          sql_warehouse:
            id: "${var.warehouse_id}"
            permission: CAN_USE

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
