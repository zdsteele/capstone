bundle:
  name: edgar-intelligence-platform

# Pin the workspace so the CLI auto-selects a matching ~/.databrickscfg profile
# by host (no -p / env vars needed). Add a profile for this host, e.g.:
#   [edgar]
#   host = https://dbc-7b106152-caf3.cloud.databricks.com
#   auth_type = oauth-m2m
#   client_id = ...
#   client_secret = ...
workspace:
  host: https://dbc-7b106152-caf3.cloud.databricks.com

variables:
  catalog:
    default: bootcamp_students
  schema:
    default: zdsteele_capstone
  warehouse_id:
    default: b15d3d6f837ba428
  ciks_config:
    description: company universe for the ingest notebooks — ../config/ciks.json
      (pilot) or ../config/ciks_full.json (~470 S&P 500, from build_universe.py)
    default: ../config/ciks_full.json
  notify_email:
    description: address for job failure notifications
    default: zacharysteele8@gmail.com
  owner_user:
    description: human owner — gets CAN_MANAGE on every bundle resource, even
      when a service principal runs the deploy
    default: zacharysteele8@gmail.com

# Applies to every job / app the bundle creates, regardless of deploying
# identity. Without this, an SP-run deploy leaves the jobs invisible to the
# human owner.
permissions:
  - user_name: ${var.owner_user}
    level: CAN_MANAGE
  # the loaner service principal that currently runs the deploys
  - service_principal_name: 0813858b-972d-4b71-bec3-067778eaed91
    level: CAN_MANAGE

resources:
  jobs:

    # -----------------------------------------------------------------------
    # Daily medallion refresh — the "keep the platform current" pipeline.
    # Incremental: 01/02 only fetch new SEC filings + market days (MERGE, never
    # overwrite); 03-10 rebuild silver/gold + the AI layer on top.
    #
    # Runs live only under `-t prod` (DAB development mode pauses schedules).
    # `databricks bundle deploy -t prod`  then  `... run pipeline_daily_refresh`.
    # -----------------------------------------------------------------------
    pipeline_daily_refresh:
      name: "EDGAR - daily medallion refresh"
      description: >
        Incremental SEC + market ingest, then silver/gold marts, vector search,
        and the AI intelligence/ratios/health layer. 06:30 America/New_York,
        after the prior business day's filings are disseminated.
      tags:
        project: edgar_capstone
        owner: zdsteele
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: "America/New_York"
        # no pause_status → dev target pauses it (DAB development mode),
        # prod target leaves it live.
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 259200       # 3 days — the first full-universe run is huge
      email_notifications:
        on_failure:
          - "${var.notify_email}"
      tasks:

        - task_key: bronze_sec
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest_sec.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              ciks_config: "${var.ciks_config}"
              mode: incremental
          timeout_seconds: 86400            # 1 day — first full-universe ingest
          max_retries: 2
          min_retry_interval_millis: 120000   # SEC 429 / transient network

        # Market data is enrichment, not the critical path — yfinance is flaky and
        # silver joins the last good bars, so this does NOT gate `silver`.
        - task_key: bronze_market
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingest_market.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              ciks_config: "${var.ciks_config}"
              mode: incremental
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on:
            - task_key: bronze_sec
          notebook_task:
            notebook_path: ./notebooks/03_silver_transform.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              shuffle_partitions: "400"
          timeout_seconds: 86400            # 1 day

        - task_key: gold_marts
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/04_gold_marts.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          timeout_seconds: 86400

        - task_key: vector_search
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/05_vector_search_index.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          timeout_seconds: 86400

        - task_key: filing_intelligence
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/08_filing_intelligence.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          timeout_seconds: 86400

        - task_key: filing_diffs
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/12_filing_diffs.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          timeout_seconds: 86400

        - task_key: financial_ratios
          depends_on:
            - task_key: gold_marts
          notebook_task:
            notebook_path: ./notebooks/09_financial_ratios.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          timeout_seconds: 86400

        - task_key: valuation
          depends_on:
            - task_key: financial_ratios
          notebook_task:
            notebook_path: ./notebooks/11_valuation.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          timeout_seconds: 86400

        - task_key: company_health
          depends_on:
            - task_key: filing_intelligence
            - task_key: financial_ratios
          notebook_task:
            notebook_path: ./notebooks/10_company_health.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          timeout_seconds: 86400

    # -----------------------------------------------------------------------
    # Reverse-CDC analytics — event-driven, NOT scheduled. Fires when the app /
    # agent writes land in the lb_*_history tables (Lakebase Change Data Feed).
    # -----------------------------------------------------------------------
    analytics_cdf_on_change:
      name: "EDGAR - analytics CDF (triggered by lb_*_history)"
      description: >
        Runs 06_analytics_cdf.py when any reverse-CDC history table changes.
        Debounced 60s so a burst of agent writes batches into one run.
      tags:
        project: edgar_capstone
        owner: zdsteele
      trigger:
        table_update:
          condition: ANY_UPDATED
          table_names:
            - "${var.catalog}.${var.schema}.lb_agent_actions_history"
            - "${var.catalog}.${var.schema}.lb_saved_filings_history"
            - "${var.catalog}.${var.schema}.lb_saved_research_history"
            - "${var.catalog}.${var.schema}.lb_watchlist_companies_history"
            - "${var.catalog}.${var.schema}.lb_watchlists_history"
            - "${var.catalog}.${var.schema}.lb_agent_conversations_history"
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      max_concurrent_runs: 1
      timeout_seconds: 86400
      email_notifications:
        on_failure:
          - "${var.notify_email}"
      tasks:
        - task_key: analytics_cdf
          notebook_task:
            notebook_path: ./notebooks/06_analytics_cdf.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          timeout_seconds: 86400

  apps:
    edgar_intelligence:
      name: "edgar-intelligence"
      description: "EDGAR Intelligence Platform frontend + in-process research agent"
      source_code_path: .
      resources:
        # SQL warehouse for Gold/Silver Delta reads
        - name: sql_warehouse
          sql_warehouse:
            id: "${var.warehouse_id}"
            permission: CAN_USE
        # The Lakebase binding is added per-target (see `targets.prod` below).
        # Binding the branch requires CAN_MANAGE on the `zdsteele-capstone`
        # Postgres project — the deploying identity must own it or be granted it.
        # Locally / dev the app reads Lakebase via LAKEBASE_URL (edgar_app role).

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    resources:
      apps:
        edgar_intelligence:
          resources:
            - name: sql_warehouse
              sql_warehouse:
                id: "${var.warehouse_id}"
                permission: CAN_USE
            # Lakebase autoscaling Postgres (projects/branches — not classic
            # Database Instances). Apps provisions a Postgres role for the app
            # SP and injects PGHOST/PGUSER/PGDATABASE/PGPORT + a rotated OAuth
            # credential. Paths: `databricks postgres list-branches projects/zdsteele-capstone`.
            - name: database
              postgres:
                branch: projects/zdsteele-capstone/branches/production
                database: projects/zdsteele-capstone/branches/production/databases/databricks-postgres
                permission: CAN_CONNECT_AND_CREATE
