bundle:
  name: edgar-intelligence-platform

variables:
  catalog:
    default: bootcamp_students
  schema:
    default: zdsteele_capstone
  warehouse_id:
    default: b15d3d6f837ba428
  notify_email:
    description: address for job failure notifications
    default: zacharysteele8@gmail.com

resources:
  jobs:

    # -----------------------------------------------------------------------
    # Daily medallion refresh — the "keep the platform current" pipeline.
    # Incremental: 01/02 only fetch new SEC filings + market days (MERGE, never
    # overwrite); 03-10 rebuild silver/gold + the AI layer on top.
    #
    # Runs live only under `-t prod` (DAB development mode pauses schedules).
    # `databricks bundle deploy -t prod`  then  `... run pipeline_daily_refresh`.
    # -----------------------------------------------------------------------
    pipeline_daily_refresh:
      name: "EDGAR - daily medallion refresh"
      description: >
        Incremental SEC + market ingest, then silver/gold marts, vector search,
        and the AI intelligence/ratios/health layer. 06:30 America/New_York,
        after the prior business day's filings are disseminated.
      tags:
        project: edgar_capstone
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: "America/New_York"
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 14400        # 4h ceiling for the whole run
      email_notifications:
        on_failure:
          - "${var.notify_email}"
      tasks:

        - task_key: bronze_sec
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest_sec.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              mode: incremental
          timeout_seconds: 5400
          max_retries: 2
          min_retry_interval_millis: 120000   # SEC 429 / transient network

        # Market data is enrichment, not the critical path — yfinance is flaky and
        # silver joins the last good bars, so this does NOT gate `silver`.
        - task_key: bronze_market
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingest_market.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              mode: incremental
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on:
            - task_key: bronze_sec
          notebook_task:
            notebook_path: ./notebooks/03_silver_transform.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"

        - task_key: gold_marts
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/04_gold_marts.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"

        - task_key: vector_search
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/05_vector_search_index.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"

        - task_key: filing_intelligence
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/08_filing_intelligence.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"

        - task_key: financial_ratios
          depends_on:
            - task_key: gold_marts
          notebook_task:
            notebook_path: ./notebooks/09_financial_ratios.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"

        - task_key: company_health
          depends_on:
            - task_key: filing_intelligence
            - task_key: financial_ratios
          notebook_task:
            notebook_path: ./notebooks/10_company_health.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"

    # -----------------------------------------------------------------------
    # Reverse-CDC analytics — event-driven, NOT scheduled. Fires when the app /
    # agent writes land in the lb_*_history tables (Lakebase Change Data Feed).
    # -----------------------------------------------------------------------
    analytics_cdf_on_change:
      name: "EDGAR - analytics CDF (triggered by lb_*_history)"
      description: >
        Runs 06_analytics_cdf.py when any reverse-CDC history table changes.
        Debounced 60s so a burst of agent writes batches into one run.
      tags:
        project: edgar_capstone
      trigger:
        table_update:
          condition: ANY_UPDATED
          table_names:
            - "${var.catalog}.${var.schema}.lb_agent_actions_history"
            - "${var.catalog}.${var.schema}.lb_saved_filings_history"
            - "${var.catalog}.${var.schema}.lb_saved_research_history"
            - "${var.catalog}.${var.schema}.lb_watchlist_companies_history"
            - "${var.catalog}.${var.schema}.lb_watchlists_history"
            - "${var.catalog}.${var.schema}.lb_agent_conversations_history"
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - "${var.notify_email}"
      tasks:
        - task_key: analytics_cdf
          notebook_task:
            notebook_path: ./notebooks/06_analytics_cdf.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"

  apps:
    edgar_intelligence:
      name: "edgar-intelligence"
      description: "EDGAR Intelligence Platform frontend + in-process research agent"
      source_code_path: .
      resources:
        # Lakebase — injects PGHOST/PGUSER/PGDATABASE/PGPORT + a rotated credential
        - name: database
          database:
            database_name: databricks_postgres
            instance_name: zdsteele-capstone
            permission: CAN_CONNECT_AND_CREATE
        # SQL warehouse for Gold/Silver Delta reads
        - name: sql_warehouse
          sql_warehouse:
            id: "${var.warehouse_id}"
            permission: CAN_USE

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
