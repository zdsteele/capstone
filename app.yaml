command:
  - "python"
  - "app.py"

env:
  # Lakebase (Postgres) — the deployed app gets PGHOST/PGUSER/PGDATABASE/PGPORT
  # (+ a rotated credential) automatically from the `database` resource binding
  # in databricks.yml. lib/lakebase.py reads those; no secret to create.
  - name: LAKEBASE_SCHEMA
    value: "edgar"
  - name: LAKEBASE_INSTANCE
    value: "zdsteele-capstone"

  # SQL warehouse for Gold/Silver Delta reads (lib/warehouse.py)
  - name: DATABRICKS_WAREHOUSE_ID
    value: "b15d3d6f837ba428"

  # Unity Catalog location of the medallion tables
  - name: UC_CATALOG
    value: "bootcamp_students"
  - name: UC_SCHEMA
    value: "zdsteele_capstone"

  # Foundation model for the in-process agent
  - name: LLM_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"

  # Vector Search — hybrid semantic retrieval over context-enriched filing chunks
  # (notebook 05). Blank both to fall back to keyword ILIKE.
  - name: VS_ENDPOINT
    value: "zachy_vs"
  - name: VS_INDEX
    value: "bootcamp_students.zdsteele_capstone.filing_text_index"
  - name: EMBEDDING_ENDPOINT
    value: "databricks-gte-large-en"

  # SEC requires a descriptive User-Agent with a real contact
  - name: SEC_USER_AGENT
    value: "EDGAR Intelligence Platform - Zach Steele zacharysteele8@gmail.com"
