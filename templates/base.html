<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}EDGAR Intelligence Platform{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('search_page') }}">EDGAR&nbsp;Intelligence</a>
    <nav>
      <a href="{{ url_for('search_page') }}" class="{% block nav_search %}{% endblock %}">Search</a>
      <a href="{{ url_for('dashboard_page') }}" class="{% block nav_dash %}{% endblock %}">Dashboard</a>
      <a href="{{ url_for('assistant_page') }}" class="{% block nav_ai %}{% endblock %}">Research Assistant</a>
    </nav>
    <span class="spacer"></span>
    {% if username %}
      <span class="user">{{ username }}</span>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <button class="linkbtn" type="submit">sign out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block script %}{% endblock %}
</body>
</html>
