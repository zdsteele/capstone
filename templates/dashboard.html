{% extends "base.html" %}
{% block title %}Financial Dashboard · EDGAR Intelligence{% endblock %}
{% block nav_dash %}active{% endblock %}
{% block content %}
<section class="pane">
  <h1>Financial Dashboard</h1>
  <div class="tabs">
    <button class="tab active" data-tab="financials">Financials</button>
    <button class="tab" data-tab="health">Company health</button>
    <button class="tab" data-tab="activity">Platform activity</button>
  </div>

  <input id="d-company" class="search" placeholder="Ticker or CIK (e.g. AAPL)" />
  <button id="d-load">Load</button>

  <div id="tab-financials">
    <div class="cols">
      <div>
        <h3>Revenue history</h3>
        <div id="d-revenue" class="bars"></div>
      </div>
      <div>
        <h3>Latest period</h3>
        <table id="d-latest" class="grid"></table>
      </div>
    </div>
    <h3>All periods</h3>
    <div class="scroll"><table id="d-financials" class="grid"></table></div>
  </div>

  <div id="tab-health" hidden>
    <div id="h-score"></div>
    <div id="h-scores" class="scoregrid"></div>
    <div id="h-trends" class="scroll"></div>
    <div id="h-report"></div>
    <p class="muted" id="h-note"></p>
  </div>

  <div id="tab-activity" hidden>
    <h3>AI agent tool usage</h3>
    <table id="a-tools" class="grid"></table>
    <h3>Usage funnel</h3>
    <table id="a-events" class="grid"></table>
    <p class="muted" id="a-note"></p>
  </div>
</section>
<script>
let currentCik = null;

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('tab-financials').hidden = t.dataset.tab !== 'financials';
  document.getElementById('tab-health').hidden = t.dataset.tab !== 'health';
  document.getElementById('tab-activity').hidden = t.dataset.tab !== 'activity';
  if (t.dataset.tab === 'activity') loadActivity();
  if (t.dataset.tab === 'health' && currentCik) loadHealth(currentCik);
}));

async function load() {
  const c = document.getElementById('d-company').value.trim();
  if (!c) return;
  let cik = c;
  if (!/^\d+$/.test(c)) {
    const s = await getJSON(`/api/search?q=${encodeURIComponent(c)}`);
    if (!s.companies || !s.companies.length) return;
    cik = s.companies[0].cik;
  }
  currentCik = cik;
  await loadFinancials(cik);
  if (!document.getElementById('tab-health').hidden) loadHealth(cik);
}
document.getElementById('d-load').addEventListener('click', load);
document.getElementById('d-company').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });

async function loadFinancials(cik) {
  const d = await getJSON(`/api/dashboard/${cik}`);
  const rev = d.revenue || [];
  const max = Math.max(1, ...rev.map(r => Number(r.revenue) || 0));
  document.getElementById('d-revenue').innerHTML = rev.map(r => `
    <div class="bar"><span class="lbl">${r.fiscal_year} ${r.fiscal_period}</span>
      <span class="track"><span class="fill" style="width:${(Number(r.revenue)||0)/max*100}%"></span></span>
      <span class="val">${fmtUSD(r.revenue)} ${r.yoy_pct != null ? `(${r.yoy_pct > 0 ? '+' : ''}${r.yoy_pct}% YoY)` : ''}</span>
    </div>`).join('');

  const fin = d.financials || [];
  const last = fin[fin.length - 1] || {};
  document.getElementById('d-latest').innerHTML = Object.entries({
    Revenue: last.revenue, 'Gross profit': last.gross_profit, 'Operating income': last.operating_income,
    'Net income': last.net_income, 'Total assets': last.total_assets, 'Total liabilities': last.total_liabilities,
    'Operating cash flow': last.operating_cash_flow, 'EPS (diluted)': last.eps_diluted,
  }).map(([k, v]) => `<tr><th>${k}</th><td>${k.includes('EPS') ? (v ?? '—') : fmtUSD(v)}</td></tr>`).join('');

  document.getElementById('d-financials').innerHTML =
    '<tr><th>Period</th><th>Revenue</th><th>Op income</th><th>Net income</th><th>Assets</th><th>OCF</th></tr>' +
    fin.map(r => `<tr><td>${r.fiscal_year} ${r.fiscal_period}</td><td>${fmtUSD(r.revenue)}</td>
      <td>${fmtUSD(r.operating_income)}</td><td>${fmtUSD(r.net_income)}</td>
      <td>${fmtUSD(r.total_assets)}</td><td>${fmtUSD(r.operating_cash_flow)}</td></tr>`).join('');
}

function pct(v) { return v == null ? '—' : (v * 100).toFixed(1) + '%'; }
function trendMark(t) { return t === 'up' ? '▲' : t === 'down' ? '▼' : t === 'stable' ? '▬' : ''; }

async function loadHealth(cik) {
  const d = await getJSON(`/api/health/${cik}`);
  const h = d.health;
  const note = document.getElementById('h-note');
  if (!h) { document.getElementById('h-score').innerHTML = ''; note.textContent = d.note || 'No health assessment yet — run notebooks 09 + 10.'; return; }
  note.textContent = `Generated by ${h.model || 'the analyst agent'}`;

  const label = (h.overall_label || '').toLowerCase();
  document.getElementById('h-score').innerHTML = `
    <div class="healthhead">
      <span class="bigscore ${label}">${h.overall_score ?? '—'}<small>/100</small></span>
      <div><strong>${h.overall_label || ''}</strong> · trend: ${h.direction || ''}
        <div class="muted">${h.primary_strength || ''}</div>
        <div class="muted">Risk: ${h.primary_risk || ''}</div>
        <div class="muted">Watch: ${h.key_metric_next_quarter || ''}</div>
      </div>
    </div>`;

  const s = h.scores || {};
  document.getElementById('h-scores').innerHTML = Object.entries({
    'Growth quality': s.growth_quality, 'Profitability': s.profitability,
    'Cash generation': s.cash_generation, 'Balance sheet': s.balance_sheet,
    'Capital allocation': s.capital_allocation, 'Capital efficiency': s.capital_efficiency,
  }).map(([k, v]) => `<div class="scell"><span class="sv">${v ?? '—'}</span><span class="sl">${k}</span></div>`).join('');

  const rr = d.ratios || [];
  document.getElementById('h-trends').innerHTML =
    '<table class="grid"><tr><th>Period</th><th>Rev growth</th><th>Op margin</th><th>FCF margin</th><th>ROIC≈</th><th>Net debt</th></tr>' +
    rr.map(r => `<tr><td>${r.fiscal_year} ${r.fiscal_period}</td>
      <td>${pct(r.revenue_growth_yoy)}</td>
      <td>${pct(r.operating_margin)} ${trendMark(r.operating_margin_trend)}</td>
      <td>${pct(r.fcf_margin)} ${trendMark(r.fcf_margin_trend)}</td>
      <td>${pct(r.roic_approx)} ${trendMark(r.roic_approx_trend)}</td>
      <td>${fmtUSD(r.net_debt)} ${trendMark(r.net_debt_trend)}</td></tr>`).join('') + '</table>';

  const sec = (t, v) => v ? `<h3>${t}</h3><div class="report">${(v || '').replace(/\n/g, '<br>')}</div>` : '';
  document.getElementById('h-report').innerHTML =
    sec('What changed', h.what_changed) + sec('Cash check', h.cash_check) +
    sec('Debt check', h.debt_check) + sec('Shareholder check', h.shareholder_check) +
    sec('Accounting check', h.accounting_check) +
    sec('What management is saying', h.management_says) +
    (h.risks ? `<h3>Risks</h3><ul>${(h.risks || []).map(x => `<li>${x}</li>`).join('')}</ul>` : '') +
    sec('Bull case', h.bull_case) + sec('Base case', h.base_case) + sec('Bear case', h.bear_case) +
    (h.watch_next ? `<h3>Watch next quarter</h3><ul>${(h.watch_next || []).map(x => `<li>${x}</li>`).join('')}</ul>` : '') +
    sec('Bottom line', h.bottom_line);
}

async function loadActivity() {
  const d = await getJSON('/api/dashboard/activity');
  document.getElementById('a-tools').innerHTML =
    '<tr><th>Tool</th><th>Calls</th><th>Success rate</th></tr>' +
    (d.tool_stats || []).map(t => `<tr><td>${t.tool_name}</td><td>${t.call_count}</td>
      <td>${t.success_rate != null ? (t.success_rate * 100).toFixed(0) + '%' : '—'}</td></tr>`).join('');
  document.getElementById('a-events').innerHTML =
    '<tr><th>Event</th><th>Count</th></tr>' +
    (d.events || []).map(e => `<tr><td>${e.event_type}</td><td>${e.event_count}</td></tr>`).join('');
  document.getElementById('a-note').textContent = d.note || '';
}
</script>
{% endblock %}
