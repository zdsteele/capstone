resources:
  jobs:
    peer_financials:
      name: edgar_peer_financials_${bundle.target}
      description: >
        SEC EDGAR 10-K/10-Q (+ 8-K earnings releases) for the 23-company peer set ->
        bronze/silver/gold Delta -> the three Bloomberg peer tables
        (financials, profitability, leverage) + a reconciliation against the
        Bloomberg sample. Incremental: re-runs only fetch new filings and only send
        new releases to the LLM.
      # no cluster spec = serverless job compute
      max_concurrent_runs: 1
      timeout_seconds: 14400
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../src/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              mode: incremental
          max_retries: 2
          min_retry_interval_millis: 120000   # SEC 429 / transient network

        - task_key: silver_facts
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../src/02_silver_facts.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}

        - task_key: silver_adj_ebitda
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../src/03_silver_adj_ebitda.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              llm_endpoint: ${var.llm_endpoint}

        - task_key: silver_ltm
          depends_on:
            - task_key: silver_facts
            - task_key: silver_adj_ebitda
          notebook_task:
            notebook_path: ../src/04_silver_ltm.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}

        - task_key: gold_tables
          depends_on:
            - task_key: silver_ltm
          notebook_task:
            notebook_path: ../src/05_gold_tables.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}

        - task_key: reconcile
          depends_on:
            - task_key: gold_tables
          notebook_task:
            notebook_path: ../src/06_reconcile.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              gold_schema: ${var.gold_schema}
      tags:
        bundle: edgar_peer_financials
        owner_team: dbx-team-eng
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: America/New_York
        pause_status: PAUSED
